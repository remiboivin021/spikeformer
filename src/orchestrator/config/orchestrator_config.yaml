# Orchestrator Configuration
# SpikeFormer - Main Pipeline Settings

# Pipeline configuration
pipeline:
  num_channels: 64
  num_neurons: 64
  embedding_dim: 256
  d_model: 256
  num_heads: 8
  num_layers: 4
  num_actions: 10

# C1-SNN configuration
c1_snn:
  enabled: true
  event_processor:
    num_channels: 64
    time_resolution: 1.0
  embedding:
    dimension: 256
    num_neurons: 64
    time_window: 100.0

# C2-Adapter configuration
c2_adapter:
  enabled: true
  output_dim: 256
  normalize: true
  clamp_range: [-10.0, 10.0]

# C3-Transformer configuration
c3_transformer:
  enabled: true
  d_model: 256
  num_heads: 8
  num_layers: 4
  d_ff: 1024
  vocab_size: 1000

# C4-Policy configuration
c4_policy:
  enabled: true
  num_actions: 10
  safe_mode_enabled: true
  safety_threshold: 0.5

# C5-Learning configuration (disabled for runtime)
c5_learning:
  enabled: false  # Offline only
  training_endpoint: "/train"
  promotion_endpoint: "/promote"

# Safe mode
safe_mode:
  default_action: "stop"
  override_enabled: true
  bypass_pipeline: true

# State management
state_manager:
  max_history: 1000
  track_performance: true
  log_errors: true

# Router configuration
router:
  enable_safe_mode_bypass: true
  sequential_routing: true