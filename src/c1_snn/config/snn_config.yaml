# C1-SNN Configuration
# SpikeFormer - SNN Perception Layer Settings

# Neuron parameters
neuron:
  threshold: 1.0
  reset_value: 0.0
  tau_m: 20.0  # Membrane time constant (ms)
  refractory_period: 2.0  # Refractory period (ms)

# Synapse parameters
synapse:
  initial_weight: 0.5
  min_weight: 0.0
  max_weight: 1.0

# STDP learning parameters
stdp:
  tau_plus: 20.0  # Time constant for potentiation (ms)
  tau_minus: 20.0  # Time constant for depression (ms)
  a_plus: 0.01  # Learning rate for potentiation
  a_minus: 0.012  # Learning rate for depression
  enabled: false  # STDP disabled during inference

# Event processing
event_processor:
  num_channels: 64
  time_resolution: 1.0  # ms

# Embedding generation
embedding:
  dimension: 256
  num_neurons: 64
  time_window: 100.0  # ms for rate calculation

# Network topology
network:
  input_neurons: 64
  hidden_neurons: 128
  output_neurons: 64