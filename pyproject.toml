[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spikeformer"
version = "0.1.0"
description = "A Hybrid SNN-Transformer Cognitive Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SpikeFormer Team", email = "team@spikeformer.ai"}
]
keywords = ["snn", "transformer", "cognitive-architecture", "spiking-neural-networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "spikingjelly>=0.0.0.0.15",
    "snntorch>=0.9.0",
    "onnx>=1.14.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
snn = [
    "aihwkit>=0.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/spikeformer/SpikeFormer"
Documentation = "https://spikeformer.readthedocs.io"
Repository = "https://github.com/spikeformer/SpikeFormer"
Issues = "https://github.com/spikeformer/SpikeFormer/issues"

[tool.setuptools]
packages = ["src", "interfaces"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"