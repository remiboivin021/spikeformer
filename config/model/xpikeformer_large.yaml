# Xpikeformer Large config (8-768)
# Reference: Table I du papier Xpikeformer

model:
  name: xpikeformer_large
  d_model: 768
  n_heads: 12
  n_layers: 8
  T: 8
  dropout: 0.0

ffn:
  hidden_dim: 3072
  activation: "gelu"

ssa:
  d_k: 64
  use_stochastic: true
  noise_std: 0.0

aimc:
  tile_size: 128
  adc_sharing: 8
  resolution: 5
  noise_std: 0.0

training:
  batch_size: 16
  epochs: 100
  learning_rate: 1.0e-3
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 5