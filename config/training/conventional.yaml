# Conventional Training (CT) config
# Reference: Section IV, Section V-A papier Xpikeformer
# Pretrained ImageNet model fine-tuned on CIFAR-10

training:
  name: conventional
  mode: ct                    # conventional training
  dataset: cifar10
  data_dir: ./data
  num_epochs: 20              # Fine-tuning = fewer epochs needed
  model_type: resnet18        # Pretrained ImageNet
  freeze_backbone: false     # Fine-tune all layers
  
  # Optimizer
  optimizer:
    type: adamw
    lr: 1.0e-3
    weight_decay: 0.05
    betas: [0.9, 0.999]
    eps: 1.0e-8
  
  # Scheduler
  scheduler:
    type: cosine_annealing
    T_max: 100
    eta_min: 1.0e-5
  
  # Loss
  loss:
    type: cross_entropy
    label_smoothing: 0.0
  
  # Hardware simulation (ideal - no noise)
  hardware:
    noise_std: 0.0
    enable_drift: false
  
  # Data augmentation
  augmentation:
    random_crop: true
    random_flip: true
    normalize: true