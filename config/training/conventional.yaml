# Conventional Training (CT) config
# Reference: Section IV-A papier Xpikeformer
# Mode: FP32 ideal, pas de bruit PCM

training:
  name: conventional
  mode: ct                    # conventional training
  dataset: cifar10         # CIFAR-10 dataset
  data_dir: ./data
  device: cpu            # Force CPU (P100 not compatible with PyTorch)
  
  # Optimizer
  optimizer:
    type: adamw
    lr: 1.0e-3
    weight_decay: 0.05
    betas: [0.9, 0.999]
    eps: 1.0e-8
  
  # Scheduler
  scheduler:
    type: cosine_annealing
    T_max: 100
    eta_min: 1.0e-5
  
  # Loss
  loss:
    type: cross_entropy
    label_smoothing: 0.0
  
  # Hardware simulation (ideal - no noise)
  hardware:
    noise_std: 0.0
    enable_drift: false
  
  # Data augmentation
  augmentation:
    random_crop: true
    random_flip: true
    normalize: true